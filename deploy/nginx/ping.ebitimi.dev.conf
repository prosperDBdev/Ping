# nginx site for ping.ebitimi.dev
#
# Goes on the server at /etc/nginx/sites-available/ping.ebitimi.dev
# then symlinked into /etc/nginx/sites-enabled/
#
# This is the PORT 80 version. Do not add TLS by hand — certbot rewrites this
# file to add the :443 server block and the http->https redirect once the
# certificate exists. Writing it yourself first just gives certbot something
# to argue with.
#
# Both apps sit behind this one server block on one domain, which is why the
# browser never makes a cross-origin request and CORS stops mattering.

server {
    listen 80;
    listen [::]:80;

    server_name ping.ebitimi.dev;

    # --------------------------------------------------------------------
    # Upload size.
    #
    # nginx defaults to 1 MEGABYTE. Ping accepts images up to 10MB
    # (spring.servlet.multipart.max-file-size), so without this line every
    # photo over 1MB dies here with a bare nginx 413 page, before the request
    # ever reaches Spring — which means the friendly error message and the
    # ApiErrorResponse shape never get a chance to run. The symptom looks like
    # "uploads are broken" with nothing in the application log at all.
    # --------------------------------------------------------------------
    client_max_body_size 10M;

    access_log /var/log/nginx/ping.access.log;
    error_log  /var/log/nginx/ping.error.log;

    # --------------------------------------------------------------------
    # The Next.js app.
    # --------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --------------------------------------------------------------------
    # The Spring Boot API.
    #
    # proxy_pass has NO trailing path, which means nginx forwards the URI
    # unchanged — /api/users/me arrives at Spring as /api/users/me. Adding a
    # trailing slash here would strip the /api prefix and every endpoint would
    # 404, which is a genuinely confusing hour to lose.
    #
    # X-Forwarded-For matters more here than anywhere else: Spring is
    # configured with server.forward-headers-strategy=native, and the sign-in
    # rate limiter counts attempts per IP. Without this header every single
    # user looks like 127.0.0.1 — so five bad passwords from one stranger
    # would lock out everybody on the site at once.
    # --------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --------------------------------------------------------------------
    # The WebSocket / SockJS endpoint.
    #
    # Prefix match without a trailing slash on purpose: SockJS requests both
    # /ws/info and /ws/<server>/<session>/websocket, and a `location /ws/`
    # would miss a bare /ws.
    #
    # THE UPGRADE HEADERS are what turn an ordinary HTTP request into a
    # WebSocket. Without them nginx proxies the handshake as a plain request,
    # the upgrade never completes, and SockJS silently falls back or fails —
    # the app loads fine and messages simply never arrive.
    #
    # THE TIMEOUT is the other half. nginx closes an idle proxied connection
    # after 60 seconds by default. A chat that nobody types in for a minute is
    # normal, so with the default the socket dies, stompjs reconnects five
    # seconds later, and the cycle repeats forever. That is the "connects, then
    # dies a minute later" symptom.
    # --------------------------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Live messages should leave immediately rather than waiting for
        # nginx to accumulate a buffer's worth.
        proxy_buffering off;
    }
}
