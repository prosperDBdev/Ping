# Test-only configuration.
#
# Lives on the TEST classpath, so it overrides src/main/resources during
# `mvn test` and is never packaged into the application jar. Nothing here
# reaches production.
#
# It exists because the application now refuses to start without JWT_SECRET —
# which is the behaviour we want, but it would otherwise mean `mvn test` failing
# on any machine that hasn't set the variable, including CI. A test suite that
# depends on the developer's shell environment is a test suite that passes on
# one laptop.
#
# This value is deliberately long enough to satisfy HS256's 256-bit minimum and
# deliberately obvious about being fake. It is not a secret and committing it
# leaks nothing: it signs tokens for a context that is thrown away when the
# test JVM exits.
jwt.secret=test-only-signing-key-not-used-anywhere-real-0123456789abcdef
jwt.expiration=86400000

spring.data.mongodb.uri=mongodb://localhost:27017/ping-test
app.cors.allowed-origins=http://localhost:3000

# A test application.properties REPLACES the main one rather than merging with
# it — same filename, and the test classpath wins. So every key the application
# needs has to be restated here, including ones the tests never exercise. Miss
# one and the context fails with "Could not resolve placeholder", which is a
# confusing error for a file you only added to set a signing key.
r2.account-id=test
r2.access-key=test
r2.secret-key=test
r2.bucket-name=ping-media-test

# Cleanup jobs stay in dry-run under test: nothing should be able to delete
# anything while a suite is running.
temporary-chat.cleanup.dry-run=true
status.cleanup.dry-run=true

# Needed by EmailService and PasswordResetService (no default, on purpose).
app.frontend-url=http://localhost:3000
