spring.application.name=ping-backend

# Hosting platforms (Render, Koyeb, Railway) inject the port they want the app
# to listen on as $PORT and route traffic there. Binding to a fixed 8080 makes
# the container start fine and then fail every health check, because nothing is
# listening where the platform is looking. Falls back to 8080 locally.
server.port=${PORT:8080}

# MongoDB.
# Local development uses the Docker container; production passes a full Atlas
# connection string. It is an env var because that string contains a password.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ping}

# JWT signing key.
#
# NO DEFAULT VALUE, deliberately. This is the key that signs and verifies every
# token in the system — anyone holding it can forge a token for any user, and
# the server will accept it because the signature genuinely checks out. It is
# the whole authentication system in one string, so it must never be committed.
#
# Leaving it with an empty default (the way the R2 keys below are written) would
# be worse than useless: the app would boot happily with an empty signing key
# and appear to work. Written this way, a missing JWT_SECRET stops the
# application from starting at all, loudly, at the moment the mistake is made.
#
# Set it in IntelliJ: Run > Edit Configurations > Environment Variables.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# 86400000 ms = 24 hours

# Where the browser app is served from, for CORS.
# Comma-separated, so local development and the deployed frontend can coexist.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Where the web app lives — used to build the links inside emails.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Brevo (email). Blank locally: nothing is sent, and on localhost the reset link
# is printed to the log instead so the flow can still be tested. Brevo requires
# the sender address to be verified in its dashboard before it will send.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Ping}

# How long a password reset link works.
password-reset.token-ttl-minutes=15

# Cloudflare R2 (S3-compatible object storage)
# Reads from environment variables so real credentials never live in this file.
# IntelliJ: Run > Edit Configurations > Environment Variables to set these locally.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:ping-media}

# Temporary conversation cleanup
# dry-run=true means the job only LOGS what it would delete, never deletes.
# Leave it true until you've watched a few cycles of logs and confirmed it's
# selecting exactly what you expect.
temporary-chat.cleanup.dry-run=true
temporary-chat.cleanup.grace-period-hours=24
temporary-chat.cleanup.interval-ms=3600000

# 24-hour statuses
# expiry-hours is what actually makes a status disappear from the API — every
# feed query filters on it, so visibility never depends on a job having run.
status.expiry-hours=24
# Free-tier guard: a hard ceiling on how much any one account can store per day.
status.max-per-user-per-day=30
# Cleanup deletes the Mongo document AND the R2 object. Same dry-run discipline
# as the temporary-conversation job: it only logs until you turn this off.
status.cleanup.dry-run=true
status.cleanup.grace-period-hours=2
status.cleanup.interval-ms=1800000

# Multipart upload limits — the hard ceiling Spring enforces before your request even
# reaches a controller. MediaStorageService enforces the real (smaller) business rule
# itself, so that failure comes back as a clean 400 instead of Spring's generic one.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB