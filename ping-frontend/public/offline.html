<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ping — offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f7f4ec;
        color: #1b2f35;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #12181b; color: #e8e6e1; }
      }
      .mark {
        width: 56px; height: 56px; border-radius: 16px;
        background: #e0684b; margin: 0 auto 1.5rem;
        display: grid; place-items: center;
        font-size: 28px; line-height: 1;
      }
      h1 { font-size: 1.25rem; font-weight: 800; margin: 0 0 .5rem; }
      p { margin: 0 0 1.5rem; opacity: .7; font-size: .875rem; max-width: 22rem; }
      button {
        font: inherit; font-weight: 700; font-size: .8125rem;
        background: #e0684b; color: #fff; border: 0;
        padding: .75rem 1.5rem; border-radius: 999px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">⚡</div>
      <h1>You're offline</h1>
      <p>Ping needs a connection to load your conversations. Nothing has been lost — this device just can't reach the server right now.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
